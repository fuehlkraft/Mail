<html lang="de">
<head>

<title>Fühlkraft · E-Mail Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" sizes="192x192" href="fk-icon-192.png">
<link rel="apple-touch-icon" href="fk-icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f7f3ee; --linen: #eae1d8; --terra: #c57f63;
  --dark: #5a3224; --sage: #7a9e7e; --muted: #8a7060;
  --text: #3a2318; --warn: #c0714a;
}
body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-box { background: white; border: 1px solid var(--linen); border-radius: 16px; padding: 48px 40px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 8px 32px rgba(90,50,36,0.08); }
.login-logo { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--dark); margin-bottom: 4px; }
.login-logo span { color: var(--terra); }
.login-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: var(--muted); margin-bottom: 32px; }
.btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--dark); color: white; border: none; border-radius: 8px; padding: 14px 24px; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; }
.btn-google:hover { background: #7a4430; }
.login-note { font-size: 11px; color: var(--muted); margin-top: 16px; line-height: 1.6; }

/* HEADER */
.header { background: var(--dark); padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(90,50,36,0.15); }
.logo { font-family: 'Cormorant Garamond', serif; color: var(--cream); font-size: 22px; letter-spacing: 0.04em; }
.logo span { color: var(--terra); }
.header-right { display: flex; align-items: center; gap: 10px; }
.status-hint { font-size: 11px; color: rgba(234,225,216,0.6); }
.user-badge { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--cream); border-radius: 20px; padding: 5px 14px; font-size: 12px; }
.btn-icon { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--cream); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: background 0.2s; font-family: 'Lato', sans-serif; }
.btn-icon:hover { background: rgba(255,255,255,0.2); }
.btn-refresh { background: var(--terra); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
.btn-refresh:hover { background: #a8694f; }

/* STATS */
.stats-bar { background: var(--linen); border-bottom: 1px solid #d4c8bc; padding: 12px 40px; display: flex; gap: 24px; align-items: center; }
.stat { display: flex; align-items: center; gap: 8px; }
.stat-num { font-family: 'Cormorant Garamond', serif; font-size: 30px; line-height: 1; }
.stat-num.terra { color: var(--terra); }
.stat-num.sage { color: var(--sage); }
.stat-num.warn { color: var(--warn); }
.stat-num.muted { color: var(--muted); }
.stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-divider { width: 1px; height: 26px; background: #c8bab0; }
.last-update { margin-left: auto; font-size: 11px; color: var(--muted); }

/* TABS */
.filter-tabs { padding: 0 40px; display: flex; background: white; border-bottom: 2px solid var(--linen); }
.tab { padding: 13px 18px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab:hover { color: var(--dark); }
.tab.active { color: var(--dark); border-bottom-color: var(--terra); }

/* BODY */
.body-layout { display: flex; min-height: calc(100vh - 165px); }

/* SIDEBAR */
.sidebar { width: 270px; flex-shrink: 0; background: var(--linen); border-right: 1px solid #d4c8bc; overflow-y: auto; display: none; }
.sidebar.open { display: block; }
.sidebar-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 14px 18px 8px; }
.sender-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; cursor: pointer; transition: background 0.15s; border-left: 3px solid transparent; }
.sender-item:hover { background: rgba(197,127,99,0.08); }
.sender-item.active { background: rgba(197,127,99,0.14); border-left-color: var(--terra); }
.sender-av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
.av-terra { background: var(--terra); } .av-sage { background: var(--sage); } .av-dark { background: var(--dark); } .av-muted { background: var(--muted); }
.sender-info { flex: 1; min-width: 0; }
.sender-name { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sender-sub { font-size: 10px; color: var(--muted); }
.sender-cnt { font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 7px; flex-shrink: 0; color: white; }
.cnt-terra { background: var(--terra); } .cnt-sage { background: var(--sage); } .cnt-grey { background: var(--muted); }

/* TOOLBAR */
.toolbar { padding: 12px 40px; background: white; border-bottom: 1px solid var(--linen); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 52px; }
.toolbar-left { display: flex; align-items: center; gap: 10px; flex: 1; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; color: var(--dark); }
.section-count { font-size: 11px; color: var(--muted); }

/* SELECTION TOOLBAR */
.sel-toolbar { display: none; align-items: center; gap: 8px; background: #fdeee9; border: 1px solid #f0c8b8; border-radius: 8px; padding: 6px 14px; }
.sel-toolbar.show { display: flex; }
.sel-count { font-size: 12px; font-weight: 700; color: var(--dark); }
.btn-sel { border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.15s; font-family: 'Lato', sans-serif; white-space: nowrap; }
.btn-sel-del { border-color: var(--warn); color: var(--warn); background: none; }
.btn-sel-del:hover { background: var(--warn); color: white; }
.btn-sel-move { border-color: var(--terra); color: var(--terra); background: none; }
.btn-sel-move:hover { background: var(--terra); color: white; }
.btn-sel-clear { border-color: var(--muted); color: var(--muted); background: none; font-size: 12px; padding: 4px 8px; }

/* FOLDER DROPDOWN */
.folder-dropdown { position: relative; display: inline-block; }
.folder-menu { display: none; position: fixed; background: white; border: 1px solid var(--linen); border-radius: 8px; box-shadow: 0 8px 24px rgba(90,50,36,0.18); min-width: 220px; z-index: 9000; overflow: hidden; max-height: 320px; overflow-y: auto; }
.folder-menu.open { display: block; }
.folder-item { padding: 10px 16px; font-size: 13px; color: var(--text); cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 8px; }
.folder-item:hover { background: var(--cream); }
.folder-divider { height: 1px; background: var(--linen); }
.folder-new { color: var(--terra); font-weight: 700; }

/* MAIN */
.main-content { flex: 1; padding: 20px 40px; overflow-x: visible; }

/* CHECKBOX + EMAIL ROW */
.email-list { display: flex; flex-direction: column; gap: 6px; position: relative; }
.email-row {
  background: white; border: 1px solid var(--linen); border-radius: 10px;
  display: flex; align-items: center; gap: 0;
  transition: border-color 0.15s, box-shadow 0.15s;
  animation: fadeIn 0.2s ease forwards; opacity: 0;
  overflow: visible;
  position: relative; z-index: 1;
}
.email-row:hover { border-color: #d4b5a8; box-shadow: 0 2px 8px rgba(197,127,99,0.06); z-index: 50; }
.email-row.selected { border-color: var(--terra); background: #fdf8f5; }
@keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }

.row-check { width: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; padding: 14px 0; }
.row-check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--terra); cursor: pointer; }

.row-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.row-icon.WICHTIG { background: #fdeee9; }
.row-icon.RECHNUNG { background: #fef3e2; }
.row-icon.NEWSLETTER { background: #eef5ee; }
.row-icon.SPAM { background: #f2f2f2; }

.row-body { flex: 1; min-width: 0; padding: 13px 14px; }
.row-subject { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { display: flex; align-items: center; gap: 12px; }
.row-from { font-size: 11px; color: var(--muted); cursor: pointer; }
.row-from:hover { color: var(--terra); text-decoration: underline; }
.row-date { font-size: 11px; color: #b0a098; }

.row-right { display: flex; align-items: center; gap: 6px; padding: 0 14px 0 0; flex-shrink: 0; }
.pill { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
.pill.WICHTIG { background: #fdeee9; color: #993c1d; }
.pill.RECHNUNG { background: #fef3e2; color: #854f0b; }
.pill.NEWSLETTER { background: #eef5ee; color: #3b6d11; }
.pill.SPAM { background: #f0f0f0; color: #888; }

.row-btns { display: flex; gap: 5px; align-items: center; }
.btn-a { border-radius: 6px; padding: 5px 9px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.15s; white-space: nowrap; font-family: 'Lato', sans-serif; background: none; }
.btn-open-m { border-color: var(--linen); color: var(--muted); }
.btn-open-m:hover { border-color: var(--terra); color: var(--terra); }
.btn-del { border-color: #f0c8c0; color: var(--warn); }
.btn-del:hover { background: #fdeee9; }
.btn-unsub { border-color: #c8e8c8; color: #3b6d11; }
.btn-unsub:hover { background: #eef5ee; }
.btn-folder { border-color: var(--linen); color: var(--muted); }
.btn-folder:hover { border-color: var(--terra); color: var(--terra); }
.btn-hide { border-color: var(--linen); color: #c8b0a8; font-size: 13px; padding: 4px 7px; }
.btn-hide:hover { border-color: var(--terra); color: var(--terra); }

/* STATES */
.loading { text-align: center; padding: 60px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--terra); margin: 0 3px; animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4;} 40%{transform:scale(1);opacity:1;} }
.empty { text-align: center; padding: 60px; color: var(--muted); }
.empty-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; color: var(--dark); margin-bottom: 6px; }
.hidden-bar { font-size: 11px; color: var(--muted); text-align: center; padding: 10px; }
.hidden-bar a { color: var(--terra); cursor: pointer; text-decoration: underline; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--cream); padding: 11px 22px; border-radius: 8px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
.toast.show { opacity: 1; }

/* NEW FOLDER MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,35,24,0.4); z-index: 999; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--cream); border-radius: 12px; padding: 28px; width: 360px; box-shadow: 0 16px 48px rgba(90,50,36,0.2); }
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--dark); margin-bottom: 16px; }
.modal-input { width: 100%; padding: 10px 14px; border: 1px solid var(--linen); border-radius: 6px; font-family: 'Lato', sans-serif; font-size: 14px; background: white; color: var(--text); margin-bottom: 14px; }
.modal-input:focus { outline: none; border-color: var(--terra); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn-modal-cancel { background: none; border: 1px solid var(--linen); border-radius: 6px; padding: 8px 16px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: 'Lato', sans-serif; }
.btn-modal-ok { background: var(--terra); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Lato', sans-serif; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Fühlkraft <span>·</span> E-Mail</div>
    <div class="login-sub">Dein persönliches Postfach-Dashboard</div>
    <button class="btn-google" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.8 20-21 0-1.4-.2-2.7-.5-4z"/></svg>
      Mit Google anmelden
    </button>
    <p class="login-note">Deine Daten bleiben bei dir – nichts wird gespeichert.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">
  <div class="header">
    <div class="logo">Fühlkraft <span>·</span> E-Mail Dashboard</div>
    <div class="header-right">
      <span class="status-hint" id="statusHint">–</span>
      <span class="user-badge" id="userBadge">–</span>
      <button class="btn-icon" onclick="signOut()">↩ Abmelden</button>
      <button class="btn-refresh" onclick="loadGmail()">↻ Aktualisieren</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-num terra" id="cW">0</div><div><div class="stat-label">Wichtig</div></div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num warn" id="cR">0</div><div><div class="stat-label">Rechnungen</div></div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num sage" id="cN">0</div><div><div class="stat-label">Newsletter</div></div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num muted" id="cS">0</div><div><div class="stat-label">Spam</div></div></div>
    <div class="last-update" id="lastUpdate">–</div>
  </div>

  <div class="filter-tabs">
    <button class="tab active" onclick="setFilter('alle',this)">Alle</button>
    <button class="tab" onclick="setFilter('WICHTIG',this)">⚡ Wichtig</button>
    <button class="tab" onclick="setFilter('RECHNUNG',this)">🧾 Rechnungen</button>
    <button class="tab" onclick="setFilter('NEWSLETTER',this)">📧 Newsletter</button>
    <button class="tab" onclick="setFilter('SPAM',this)">🚫 Spam</button>
    <button class="tab" onclick="setFilter('absender',this)">👤 Absender</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="section-title" id="sectionTitle">Alle E-Mails</span>
      <span class="section-count" id="sectionCount"></span>
    </div>
    <!-- SELECTION TOOLBAR -->
    <div class="sel-toolbar" id="selToolbar">
      <span class="sel-count" id="selCount">0 ausgewählt</span>
      <button class="btn-sel btn-sel-del" onclick="deleteSelected()">🗑 Löschen</button>
      <div class="folder-dropdown">
        <button class="btn-sel btn-sel-move" onclick="toggleFolderMenu('sel', this)">📁 In Ordner →</button>
        <div class="folder-menu" id="folderMenuSel"></div>
      </div>
      <button class="btn-sel btn-sel-clear" onclick="clearSelection()">✕ Abwählen</button>
    </div>
  </div>

  <div class="body-layout">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-label">Absender auswählen</div>
      <div id="senderList"></div>
    </div>

    <!-- MAIN -->
    <div class="main-content">
      <div class="loading" id="loadingEl"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="email-list" id="emailList"></div>
      <div class="empty" id="emptyEl" style="display:none;"><div class="empty-title" id="emptyTitle">Keine E-Mails hier</div></div>
      <div class="hidden-bar" id="hiddenBar" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- NEW FOLDER MODAL -->
<div class="modal-overlay" id="newFolderModal" onclick="if(event.target===this)closeNewFolder()">
  <div class="modal-box">
    <div class="modal-title">Neuen Ordner erstellen</div>
    <input class="modal-input" id="newFolderName" placeholder="z.B. Fühlkraft, Rechnungen 2026, Pferde..." onkeydown="if(event.key==='Enter')confirmNewFolder()">
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeNewFolder()">Abbrechen</button>
      <button class="btn-modal-ok" onclick="confirmNewFolder()">Erstellen ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const CLIENT_ID = '86271456400-589q4hmvjencs60p9u9hllubrhp720i6.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.readonly';
const ICONS = { WICHTIG:'⚡', RECHNUNG:'🧾', NEWSLETTER:'📧', SPAM:'🚫' };
const TITLES = { alle:'Alle E-Mails', WICHTIG:'⚡ Wichtige E-Mails', RECHNUNG:'🧾 Rechnungen', NEWSLETTER:'📧 Newsletter', SPAM:'🚫 Spam', absender:'👤 Absender' };
const AV_COLORS = ['av-terra','av-sage','av-dark','av-muted'];

let token = '';
let emails = [];
let hidden = JSON.parse(localStorage.getItem('fk_h')||'[]');
let customFolders = JSON.parse(localStorage.getItem('fk_folders')||'["Fühlkraft","Privat","Rechnungen","Pferde"]');
let selected = new Set();
let filter = 'alle';
let activeSender = null;
let pendingMoveIds = [];
let tc;

window.onload = () => {
  tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: r => {
      if (r.error) { showToast('Login fehlgeschlagen'); return; }
      token = r.access_token;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadGmail();
    }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.folder-dropdown')) {
      document.querySelectorAll('.folder-menu').forEach(m => m.classList.remove('open'));
    }
  });
};

function signIn() { tc.requestAccessToken(); }
function signOut() {
  google.accounts.oauth2.revoke(token, ()=>{});
  token = ''; emails = []; selected.clear();
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

async function loadGmail() {
  if (!token) return;
  setStatus('Laden...');
  selected.clear(); updateSelToolbar();
  document.getElementById('loadingEl').style.display = 'block';
  document.getElementById('emailList').innerHTML = '';
  document.getElementById('emptyEl').style.display = 'none';

  try {
    const profile = await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/profile');
    document.getElementById('userBadge').textContent = profile.emailAddress || '';

    const list = await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=30&labelIds=INBOX');
    const msgs = list.messages || [];
    emails = [];

    for (const m of msgs.slice(0,25)) {
      const d = await gfetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=List-Unsubscribe`);
      const hdr = d.payload?.headers || [];
      const h = n => hdr.find(x=>x.name.toLowerCase()===n.toLowerCase())?.value||'';
      const from = h('From');
      const nameM = from.match(/^"?([^"<]+)"?\s*</);
      const senderName = nameM ? nameM[1].trim() : from.split('@')[0];
      const senderEmail = from.match(/<(.+)>/)?.[1]||from;
      const subject = h('Subject')||'(kein Betreff)';
      const date = fmtDate(h('Date'));
      const unsub = h('List-Unsubscribe');
      const labels = d.labelIds||[];

      // Verbesserte Kategorie-Erkennung
      let kat = 'WICHTIG';
      const sl = subject.toLowerCase();
      const fromL = from.toLowerCase();

      if (labels.includes('SPAM')) {
        kat = 'SPAM';
      } else if (
        labels.includes('CATEGORY_PROMOTIONS') ||
        (unsub && unsub.length > 0) ||
        sl.includes('newsletter') ||
        sl.includes('angebot') ||
        sl.includes('% rabatt') ||
        sl.includes('% off') ||
        sl.includes('sale') ||
        fromL.includes('newsletter') ||
        fromL.includes('noreply') ||
        fromL.includes('no-reply') ||
        fromL.includes('marketing')
      ) {
        kat = 'NEWSLETTER';
      } else if (
        labels.includes('CATEGORY_UPDATES') ||
        sl.includes('rechnung') ||
        sl.includes('invoice') ||
        sl.includes('quittung') ||
        sl.includes('zahlung') ||
        sl.includes('bestellung') ||
        sl.includes('auftragsbestätigung') ||
        sl.includes('order confirmation')
      ) {
        kat = 'RECHNUNG';
      } else if (
        sl.includes('gewinn') ||
        sl.includes('gratis') ||
        sl.includes('preissensation') ||
        sl.includes('kostenlos') ||
        sl.includes('jetzt sichern') ||
        labels.includes('CATEGORY_SOCIAL')
      ) {
        kat = 'SPAM';
      }

      emails.push({id:m.id, subject, from, senderName, senderEmail, date, unsub, kat, labels});
    }

    document.getElementById('loadingEl').style.display = 'none';
    updateStats(); buildSenders(); render();
    document.getElementById('lastUpdate').textContent = 'Stand: '+new Date().toLocaleTimeString('de-DE');
    setStatus(emails.length+' E-Mails');
  } catch(e) {
    document.getElementById('loadingEl').style.display = 'none';
    setStatus('Fehler: '+e.message);
  }
}

async function gfetch(url) {
  const r = await fetch(url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok) throw new Error('API '+r.status);
  return r.json();
}

function updateStats() {
  document.getElementById('cW').textContent = emails.filter(e=>e.kat==='WICHTIG').length;
  document.getElementById('cR').textContent = emails.filter(e=>e.kat==='RECHNUNG').length;
  document.getElementById('cN').textContent = emails.filter(e=>e.kat==='NEWSLETTER').length;
  document.getElementById('cS').textContent = emails.filter(e=>e.kat==='SPAM').length;
}

function buildSenders() {
  const map = {};
  emails.forEach(e=>{
    if(!map[e.senderEmail]) map[e.senderEmail]={name:e.senderName,email:e.senderEmail,count:0,kat:{}};
    map[e.senderEmail].count++;
    map[e.senderEmail].kat[e.kat]=(map[e.senderEmail].kat[e.kat]||0)+1;
  });
  const senders = Object.values(map).sort((a,b)=>b.count-a.count);
  const list = document.getElementById('senderList');
  list.innerHTML='';
  senders.forEach((s,i)=>{
    const mainKat = Object.entries(s.kat).sort((a,b)=>b[1]-a[1])[0][0];
    const cntClass = mainKat==='WICHTIG'?'cnt-terra':mainKat==='NEWSLETTER'?'cnt-sage':'cnt-grey';
    const av = AV_COLORS[i%AV_COLORS.length];
    const el = document.createElement('div');
    el.className='sender-item'; el.dataset.email=s.email;
    el.onclick=()=>selectSender(s.email,el);
    el.innerHTML=`
      <div class="sender-av ${av}">${(s.name||s.email)[0].toUpperCase()}</div>
      <div class="sender-info">
        <div class="sender-name">${esc(s.name)}</div>
        <div class="sender-sub">${s.count} E-Mail${s.count>1?'s':''} · ${mainKat}</div>
      </div>
      <span class="sender-cnt ${cntClass}">${s.count}</span>`;
    list.appendChild(el);
  });
}

function selectSender(email, el) {
  activeSender = email;
  document.querySelectorAll('.sender-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const s = emails.find(e=>e.senderEmail===email);
  document.getElementById('sectionTitle').textContent = '👤 '+(s?.senderName||email);
  selected.clear(); updateSelToolbar();
  renderList(emails.filter(e=>e.senderEmail===email));
}

function setFilter(f, btn) {
  filter=f; activeSender=null;
  selected.clear(); updateSelToolbar();
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sectionTitle').textContent = TITLES[f];
  const sidebar = document.getElementById('sidebar');
  if(f==='absender'){
    sidebar.classList.add('open');
    document.getElementById('emailList').innerHTML='';
    document.getElementById('emptyEl').style.display='block';
    document.getElementById('emptyTitle').textContent='Absender links auswählen';
    document.getElementById('sectionCount').textContent='';
  } else {
    sidebar.classList.remove('open');
    render();
  }
}

function getFiltered() {
  if(filter==='alle') return emails;
  return emails.filter(e=>e.kat===filter);
}

function render() { renderList(getFiltered()); }

function renderList(list) {
  const el = document.getElementById('emailList');
  const empty = document.getElementById('emptyEl');
  const bar = document.getElementById('hiddenBar');
  el.innerHTML='';
  const visible = list.filter(e=>!hidden.includes(e.id));
  const hCount = list.length-visible.length;
  document.getElementById('sectionCount').textContent = visible.length+' E-Mails';

  if(!visible.length){
    empty.style.display='block';
    document.getElementById('emptyTitle').textContent='Keine E-Mails hier';
    bar.style.display=hCount>0?'block':'none';
    if(hCount>0) bar.innerHTML=`${hCount} ausgeblendet · <a onclick="clearHidden()">Alle anzeigen</a>`;
    return;
  }
  empty.style.display='none';

  visible.forEach((e,i)=>{
    const k=e.kat;
    const isSelected = selected.has(e.id);
    const row=document.createElement('div');
    row.className='email-row'+(isSelected?' selected':'');
    row.style.animationDelay=(i*15)+'ms';

    let extra='';
    if(k==='NEWSLETTER'||e.unsub) extra+=`<button class="btn-a btn-unsub" onclick="unsub('${esc(e.unsub)}','${esc(e.senderEmail)}')">📧 Abbestellen</button>`;

    row.innerHTML=`
      <div class="row-check">
        <input type="checkbox" ${isSelected?'checked':''} onchange="toggleSelect('${e.id}',this.checked)">
      </div>
      <div class="row-icon ${k}">${ICONS[k]||'📧'}</div>
      <div class="row-body">
        <div class="row-subject">${esc(e.subject)}</div>
        <div class="row-meta">
          <span class="row-from" onclick="goToSender('${esc(e.senderEmail)}')">👤 ${esc(e.senderName)} →</span>
          <span class="row-date">📅 ${esc(e.date)}</span>
        </div>
      </div>
      <div class="row-right">
        <span class="pill ${k}">${k}</span>
        <div class="row-btns">
          <button class="btn-a btn-open-m" onclick="window.open('https://mail.google.com/mail/#inbox/${e.id}','_blank')">↗ Öffnen</button>
          <button class="btn-a btn-del" onclick="delEmail('${e.id}')">🗑 Löschen</button>
          ${extra}
          <div class="folder-dropdown">
            <button class="btn-a btn-folder" onclick="toggleFolderMenu('${e.id}', this)">📁 Ordner</button>
            <div class="folder-menu" id="fm_${e.id}"></div>
          </div>
          <button class="btn-a btn-hide" onclick="hideEmail('${e.id}')">✕</button>
        </div>
      </div>`;
    el.appendChild(row);
  });

  bar.style.display=hCount>0?'block':'none';
  if(hCount>0) bar.innerHTML=`${hCount} ausgeblendet · <a onclick="clearHidden()">Alle anzeigen</a>`;
}

function toggleSelect(id, checked) {
  if(checked) selected.add(id);
  else selected.delete(id);
  const row = document.querySelector(`.email-row`);
  document.querySelectorAll('.email-row').forEach(r=>{
    const cb = r.querySelector('input[type=checkbox]');
    if(cb && cb.closest('.email-row') === r){
      const rid = cb.onchange?.toString().match(/'([^']+)'/)?.[1];
    }
  });
  // update selected state
  document.querySelectorAll('.email-row').forEach(r=>{
    const cb = r.querySelector('input[type=checkbox]');
    if(cb) r.classList.toggle('selected', cb.checked);
  });
  updateSelToolbar();
}

function updateSelToolbar() {
  const tb = document.getElementById('selToolbar');
  const cnt = document.getElementById('selCount');
  if(selected.size > 0) {
    tb.classList.add('show');
    cnt.textContent = selected.size+' ausgewählt';
  } else {
    tb.classList.remove('show');
  }
}

function clearSelection() {
  selected.clear();
  document.querySelectorAll('.email-row input[type=checkbox]').forEach(cb=>cb.checked=false);
  document.querySelectorAll('.email-row').forEach(r=>r.classList.remove('selected'));
  updateSelToolbar();
}

async function deleteSelected() {
  const ids = [...selected];
  if(!ids.length) return;
  if(!confirm(`${ids.length} E-Mail${ids.length>1?'s':''} in den Papierkorb?`)) return;
  setStatus('Löschen...');
  for(const id of ids){
    await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/trash`,{method:'POST',headers:{Authorization:'Bearer '+token}});
    emails=emails.filter(e=>e.id!==id);
  }
  selected.clear(); updateSelToolbar();
  updateStats(); buildSenders();
  if(activeSender) renderList(emails.filter(e=>e.senderEmail===activeSender));
  else render();
  setStatus(emails.length+' E-Mails');
  showToast(ids.length+' E-Mails gelöscht ✓');
}

async function delEmail(id) {
  if(!confirm('E-Mail in den Papierkorb?')) return;
  await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/trash`,{method:'POST',headers:{Authorization:'Bearer '+token}});
  emails=emails.filter(e=>e.id!==id);
  selected.delete(id); updateSelToolbar();
  updateStats(); buildSenders();
  if(activeSender) renderList(emails.filter(e=>e.senderEmail===activeSender));
  else render();
  showToast('In den Papierkorb verschoben ✓');
}

// FOLDER
function toggleFolderMenu(id, btnEl) {
  const menuId = id==='sel' ? 'folderMenuSel' : `fm_${id}`;
  const menu = document.getElementById(menuId);
  if(!menu) return;
  const isOpen = menu.classList.contains('open');
  document.querySelectorAll('.folder-menu').forEach(m=>m.classList.remove('open'));
  if(!isOpen) {
    pendingMoveIds = id==='sel' ? [...selected] : [id];
    menu.innerHTML = buildFolderMenu();
    // Position direkt unter dem Button
    const rect = btnEl.getBoundingClientRect();
    menu.style.position = 'fixed';
    const menuHeight = 280;
    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < menuHeight) {
      menu.style.top = Math.max(8, rect.top - menuHeight - 4) + 'px';
    } else {
      menu.style.top = (rect.bottom + 4) + 'px';
    }
    menu.style.left = Math.max(8, rect.right - 220) + 'px';
    menu.style.right = 'auto';
    menu.classList.add('open');
  }
}

function buildFolderMenu() {
  const gmailFolders = [
    {label:'📥 Posteingang', id:'INBOX'},
    {label:'⭐ Markiert', id:'STARRED'},
    {label:'🚫 Spam', id:'SPAM'},
    {label:'🗑 Papierkorb', id:'TRASH'},
  ];
  let html = gmailFolders.map(f=>`<div class="folder-item" onclick="moveToFolder('${f.id}')">${f.label}</div>`).join('');
  html += '<div class="folder-divider"></div>';
  html += customFolders.map(f=>`<div class="folder-item" onclick="moveToLabel('${esc(f)}')">🏷 ${esc(f)}</div>`).join('');
  html += '<div class="folder-divider"></div>';
  html += `<div class="folder-item folder-new" onclick="openNewFolder()">+ Neuen Ordner erstellen</div>`;
  return html;
}

async function moveToFolder(labelId) {
  document.querySelectorAll('.folder-menu').forEach(m=>m.classList.remove('open'));
  if(!pendingMoveIds.length) return;
  setStatus('Verschieben...');
  const addLabels = [labelId];
  const removeLabels = labelId==='INBOX' ? [] : ['INBOX'];
  for(const id of pendingMoveIds){
    await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/modify`,{
      method:'POST',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({addLabelIds:addLabels,removeLabelIds:removeLabels})
    });
    if(labelId!=='INBOX') emails=emails.filter(e=>e.id!==id);
  }
  selected.clear(); updateSelToolbar();
  updateStats(); buildSenders(); render();
  setStatus(emails.length+' E-Mails');
  showToast(pendingMoveIds.length+' E-Mails verschoben ✓');
  pendingMoveIds=[];
}

async function moveToLabel(labelName) {
  document.querySelectorAll('.folder-menu').forEach(m=>m.classList.remove('open'));
  if(!pendingMoveIds.length) return;
  setStatus('Label erstellen...');
  // Label suchen oder erstellen
  let labelId = '';
  try {
    const labels = await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/labels');
    const existing = labels.labels?.find(l=>l.name===labelName);
    if(existing) {
      labelId = existing.id;
    } else {
      const created = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/labels',{
        method:'POST',
        headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({name:labelName,labelListVisibility:'labelShow',messageListVisibility:'show'})
      });
      const cdata = await created.json();
      labelId = cdata.id;
    }
    for(const id of pendingMoveIds){
      await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/modify`,{
        method:'POST',
        headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({addLabelIds:[labelId]})
      });
    }
    showToast(pendingMoveIds.length+' E-Mails in "'+labelName+'" verschoben ✓');
  } catch(e) { showToast('Fehler beim Verschieben'); }
  selected.clear(); updateSelToolbar();
  setStatus(emails.length+' E-Mails');
  pendingMoveIds=[];
}

function openNewFolder() {
  document.querySelectorAll('.folder-menu').forEach(m=>m.classList.remove('open'));
  document.getElementById('newFolderName').value='';
  document.getElementById('newFolderModal').classList.add('open');
  setTimeout(()=>document.getElementById('newFolderName').focus(),100);
}

function closeNewFolder() { document.getElementById('newFolderModal').classList.remove('open'); }

function confirmNewFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if(!name) return;
  if(!customFolders.includes(name)) {
    customFolders.push(name);
    localStorage.setItem('fk_folders',JSON.stringify(customFolders));
  }
  closeNewFolder();
  if(pendingMoveIds.length) moveToLabel(name);
  else showToast('Ordner "'+name+'" erstellt ✓');
}

function goToSender(email) {
  const absTab = document.querySelectorAll('.tab')[5];
  setFilter('absender', absTab);
  setTimeout(()=>{
    const item = document.querySelector(`.sender-item[data-email="${CSS.escape(email)}"]`);
    if(item) selectSender(email,item);
  },50);
}

function unsub(link,from) {
  const mail=link?.match(/mailto:([^\s,>]+)/i);
  if(mail) window.open(`mailto:${mail[1]}?subject=Unsubscribe`,'_blank');
  else {
    const url=link?.match(/https?:\/\/[^\s,>]+/i);
    if(url) window.open(url[0],'_blank');
    else window.open(`https://mail.google.com/mail/#search/from:${encodeURIComponent(from)}`,'_blank');
  }
  showToast('Abmelde-Link geöffnet');
}

function hideEmail(id) { hidden.push(id); localStorage.setItem('fk_h',JSON.stringify(hidden)); render(); }
function clearHidden() { hidden=[]; localStorage.setItem('fk_h',JSON.stringify(hidden)); render(); }

function fmtDate(s) {
  if(!s) return '';
  try { return new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setStatus(t){ document.getElementById('statusHint').textContent=t; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
